name: Temporary Ask Ali Prettier Formatter

on:
  push:
    branches:
      - fix/ask-ali-sar-currency-contract-20261028

permissions:
  contents: write

jobs:
  format-and-commit-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/ask-ali-sar-currency-contract-20261028
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Format contract files
        run: |
          npx --yes prettier@3 --write \
            "src/components/commerce/AliAiPanel.tsx" \
            "src/features/ai/services/ask-ali.service.ts" \
            "tests/ai-product-currency-integrity-contract.test.mjs"
          git --no-pager diff -- \
            "src/components/commerce/AliAiPanel.tsx" \
            "src/features/ai/services/ask-ali.service.ts" \
            "tests/ai-product-currency-integrity-contract.test.mjs"
      - name: Commit formatted source and tests
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "src/components/commerce/AliAiPanel.tsx" \
            "src/features/ai/services/ask-ali.service.ts" \
            "tests/ai-product-currency-integrity-contract.test.mjs"
          if git diff --cached --quiet; then
            echo "No Prettier changes were needed."
            exit 0
          fi
          git commit -m "style(ai): format Ask Ali contract changes"
          git push origin HEAD:fix/ask-ali-sar-currency-contract-20261028
