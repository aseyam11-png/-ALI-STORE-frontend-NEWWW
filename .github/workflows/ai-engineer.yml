name: ALI STORE AI Engineering Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Describe one concrete bug fix or feature with acceptance criteria"
        required: true
        type: string
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ai-engineer-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  generate:
    name: Understand repository and propose a patch
    if: >-
      ${{ (github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main') ||
          (github.event_name == 'issues' &&
          github.actor == github.repository_owner &&
          github.event.label.name == 'ai-engineer') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      branch: ${{ steps.publish.outputs.branch }}
      head_sha: ${{ steps.publish.outputs.head_sha }}
      summary: ${{ steps.publish.outputs.summary }}
      files_json: ${{ steps.publish.outputs.files_json }}
      high_risk: ${{ steps.publish.outputs.high_risk }}
    steps:
      - name: Checkout trusted main source
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install and query the Graphify architecture map
        env:
          AI_TASK: ${{ inputs.task || format('Issue #{0}: {1} - {2}', github.event.issue.number, github.event.issue.title, github.event.issue.body) }}
          QUERY_FILE: ${{ runner.temp }}/graphify-query.txt
          GRAPHIFY_CONTEXT_FILE: ${{ runner.temp }}/graphify-context.txt
        run: |
          set -euo pipefail
          uv tool install --upgrade "graphifyy==0.9.79"
          if [ ! -f graphify-out/graph.json ]; then
            graphify extract . --code-only
          fi
          graphify query "$AI_TASK" > "$QUERY_FILE"
          test -s "$QUERY_FILE"
          python - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          query_file = Path(os.environ["QUERY_FILE"])
          graph_context_file = Path(os.environ["GRAPHIFY_CONTEXT_FILE"])
          query = query_file.read_text(encoding="utf-8", errors="replace")
          candidates = []
          for raw_path in re.findall(r"([^\s]+?\.[A-Za-z0-9]+):\d+", query):
              path = raw_path.strip(chr(96) + "'\"()[]{}.,;")
              target = Path(path)
              if target.is_file() and not target.is_symlink() and path not in candidates:
                  candidates.append(path)

          if not candidates:
              raise SystemExit(
                  "Graphify query returned no existing file:line citations; "
                  "refusing to guess the relevant source modules."
              )

          sections = ["## Graphify query result", query]
          for path in candidates[:2]:
              result = subprocess.run(
                  ["graphify", "explain", path],
                  capture_output=True,
                  text=True,
                  encoding="utf-8",
                  errors="replace",
              )
              sections.append("## Graphify explain: " + path)
              sections.append(result.stdout.strip() or result.stderr.strip())
              if result.returncode:
                  sections.append("Explain command exit code: " + str(result.returncode))

          endpoints = candidates[:2] if len(candidates) > 1 else [candidates[0], candidates[0]]
          result = subprocess.run(
              ["graphify", "path", endpoints[0], endpoints[1]],
              capture_output=True,
              text=True,
              encoding="utf-8",
              errors="replace",
          )
          sections.append("## Graphify path: " + endpoints[0] + " -> " + endpoints[1])
          sections.append(result.stdout.strip() or result.stderr.strip())
          if result.returncode:
              sections.append("Path command exit code: " + str(result.returncode))

          graph_context_file.write_text("\n\n".join(sections) + "\n", encoding="utf-8")
          PY
          test -s "$GRAPHIFY_CONTEXT_FILE"

      - name: Install Gemini SDK
        run: python -m pip install --disable-pip-version-check "google-genai>=1.0,<2.0"

      - name: Generate constrained source and test edits
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.8-flash' }}
          AI_TASK: ${{ inputs.task || format('Issue #{0}: {1} - {2}', github.event.issue.number, github.event.issue.title, github.event.issue.body) }}
          GRAPHIFY_CONTEXT_FILE: ${{ runner.temp }}/graphify-context.txt
          AI_RESULT_PATH: ${{ runner.temp }}/alistore-ai-result.json
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::error::GEMINI_API_KEY is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          python .github/scripts/ai_engineer.py

      - name: Refresh Graphify after proposed edits
        run: graphify update .

      - name: Commit and push isolated AI branch
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_RESULT_PATH: ${{ runner.temp }}/alistore-ai-result.json
          AI_BRANCH: ai/engineering-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t changed_paths < <(python -c 'import json,os; print("\n".join(json.load(open(os.environ["AI_RESULT_PATH"], encoding="utf-8"))["files"]))')
          if [ "${#changed_paths[@]}" -eq 0 ]; then
            echo "::error::No patch paths were produced."
            exit 1
          fi
          git diff --check
          git switch -c "$AI_BRANCH"
          git add -- "${changed_paths[@]}"
          if git diff --cached --quiet; then
            echo "::error::The generated patch contains no staged changes."
            exit 1
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "ai: propose requested engineering change"
          HEAD_SHA="$(git rev-parse HEAD)"
          export HEAD_SHA
          gh auth setup-git
          git push --set-upstream origin "$AI_BRANCH"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          result = json.loads(Path(os.environ["AI_RESULT_PATH"]).read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("branch=" + os.environ["AI_BRANCH"] + "\n")
              output.write("head_sha=" + os.environ["HEAD_SHA"] + "\n")
              output.write("summary=" + " ".join(result["summary"].split())[:500] + "\n")
              output.write("files_json=" + json.dumps(result["files"], ensure_ascii=False, separators=(",", ":")) + "\n")
              output.write("high_risk=" + str(bool(result["high_risk"])).lower() + "\n")
          PY

  create_pull_request:
    name: Open draft pull request
    needs: generate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      pr_number: ${{ steps.open.outputs.pr_number }}
      pr_url: ${{ steps.open.outputs.pr_url }}
    steps:
      - name: Checkout repository metadata context
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false

      - name: Create draft PR
        id: open
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_TASK: ${{ inputs.task || format('Issue #{0}: {1} - {2}', github.event.issue.number, github.event.issue.title, github.event.issue.body) }}
          AI_BRANCH: ${{ needs.generate.outputs.branch }}
          AI_SUMMARY: ${{ needs.generate.outputs.summary }}
          AI_FILES: ${{ needs.generate.outputs.files_json }}
          HIGH_RISK: ${{ needs.generate.outputs.high_risk }}
        shell: bash
        run: |
          set -euo pipefail
          PR_TITLE="$(python -c 'import os; print(("AI: " + " ".join(os.environ["AI_TASK"].split()))[:90])')"
          BODY_FILE="$(mktemp)"
          {
            printf '## AI Engineering Agent proposal\n\n'
            printf '**Task:** %s\n\n' "$AI_TASK"
            printf '**Proposed change:** %s\n\n' "$AI_SUMMARY"
            printf '**Changed paths:**\n'
            printf '%s\n' "$AI_FILES" | python -c 'import json,sys; [print("- " + p) for p in json.load(sys.stdin)]'
            printf '\n**Risk classification:** %s\n\n' "$HIGH_RISK"
            printf 'This PR was generated on an isolated branch. No generated code was executed in the credentialed generation job.\n\n'
            printf 'The quality-gates workflow must complete on this exact head SHA before any merge is requested. High-risk changes remain in Draft for human review.\n'
          } > "$BODY_FILE"
          gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$AI_BRANCH" --draft --title "$PR_TITLE" --body-file "$BODY_FILE"
          PR_NUMBER="$(gh pr view "$AI_BRANCH" --repo "$GITHUB_REPOSITORY" --json number --jq .number)"
          PR_URL="$(gh pr view "$AI_BRANCH" --repo "$GITHUB_REPOSITORY" --json url --jq .url)"
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

  validate:
    name: Run repository quality gates on the exact AI commit
    needs: [generate, create_pull_request]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch all required CI and security workflows for the AI branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_BRANCH: ${{ needs.generate.outputs.branch }}
          AI_SHA: ${{ needs.generate.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_FILE="$RUNNER_TEMP/alistore-validation-runs.txt"
          : > "$RUN_FILE"

          # Dispatch all suites first so independent checks can run concurrently.
          for workflow in frontend.yml quality-gates.yml advanced-quality.yml security-static.yml; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref "$AI_BRANCH"
          done

          # Require a matching run on the exact generated commit for every suite.
          for workflow in frontend.yml quality-gates.yml advanced-quality.yml security-static.yml; do
            RUN_ID=""
            for attempt in $(seq 1 60); do
              RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$workflow" --branch "$AI_BRANCH" --limit 50 --json databaseId,headSha,event --jq ".[] | select(.headSha == \"$AI_SHA\" and .event == \"workflow_dispatch\") | .databaseId" | head -n 1)"
              if [ -n "$RUN_ID" ]; then
                break
              fi
              sleep 5
            done
            if [ -z "$RUN_ID" ]; then
              echo "::error::Could not find $workflow run for $AI_SHA. The PR must remain Draft."
              exit 1
            fi
            printf '%s=%s\n' "$workflow" "$RUN_ID" >> "$RUN_FILE"
          done

          # A missing run or any non-zero result fails this validation job.
          while IFS='=' read -r workflow run_id; do
            echo "Watching $workflow run $run_id on $AI_SHA"
            gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --interval 20 --exit-status
          done < "$RUN_FILE"


  finish:
    name: Finalize based on verified results and risk
    needs: [generate, create_pull_request, validate]
    if: ${{ always() && needs.create_pull_request.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Request auto-merge after all quality gates pass
        if: ${{ needs.validate.result == 'success' && needs.generate.outputs.high_risk != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.create_pull_request.outputs.pr_number }}
          EXPECTED_SHA: ${{ needs.generate.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Auto-merge was not requested: the PR head changed after validation. The new head must be checked again."
            exit 0
          fi
          gh pr ready "$PR_NUMBER" --repo "$GITHUB_REPOSITORY"
          if gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash --delete-branch; then
            echo "Auto-merge requested after the quality-gates workflow succeeded on $EXPECTED_SHA."
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "All dispatched quality gates passed for $EXPECTED_SHA, but GitHub did not accept the auto-merge request. Check repository auto-merge settings and branch protection. This workflow did not force a merge."
            echo "::warning::Auto-merge could not be enabled; no forced merge was attempted."
          fi

      - name: Keep high-risk changes awaiting a human review
        if: ${{ needs.validate.result == 'success' && needs.generate.outputs.high_risk == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.create_pull_request.outputs.pr_number }}
          EXPECTED_SHA: ${{ needs.generate.outputs.head_sha }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "The quality-gates workflow passed for $EXPECTED_SHA, but the changed paths are classified as high risk. This PR remains Draft and must receive human review; auto-merge was not requested."

      - name: Leave an unverified PR in Draft
        if: ${{ needs.validate.result != 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ needs.create_pull_request.outputs.pr_number }}
          EXPECTED_SHA: ${{ needs.generate.outputs.head_sha }}
        run: |
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "The required quality-gates workflow did not complete successfully for $EXPECTED_SHA. This PR remains Draft. Do not merge until the failed or unavailable checks are resolved."
