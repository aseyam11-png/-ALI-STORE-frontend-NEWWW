name: Temporary Prettier Repair

on:
  push:
    branches:
      - fix/frontend-contract-hardening-20261029

permissions:
  contents: write

jobs:
  format-changed-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Format the files currently rejected by the quality gate
        run: |
          npx --yes prettier@3 --write --ignore-path .prettierignore \
            next.config.ts \
            "src/app/(shop)/shop/checkout/page.tsx" \
            src/components/auth/LoginForm.tsx \
            src/features/cart/services/cart-api.service.ts \
            src/features/products/services/product.service.ts \
            src/lib/api/http-client.ts \
            tests/auth-login-flow-contract.test.mjs \
            tests/catalog-price-currency-integrity-contract.test.mjs \
            tests/hardening-contract.test.mjs

      - name: Commit formatted source files
        run: |
          if git diff --quiet; then
            echo "No formatting changes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            next.config.ts \
            "src/app/(shop)/shop/checkout/page.tsx" \
            src/components/auth/LoginForm.tsx \
            src/features/cart/services/cart-api.service.ts \
            src/features/products/services/product.service.ts \
            src/lib/api/http-client.ts \
            tests/auth-login-flow-contract.test.mjs \
            tests/catalog-price-currency-integrity-contract.test.mjs \
            tests/hardening-contract.test.mjs
          git commit -m "style: format changed files for CI quality gate"
          git push
