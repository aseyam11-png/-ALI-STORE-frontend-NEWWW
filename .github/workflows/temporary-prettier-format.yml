name: Temporary Prettier Formatter

on:
  push:
    branches:
      - ci/actionlint-workflow-validation-20261028

permissions:
  contents: write

jobs:
  format-and-commit-cspell:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ci/actionlint-workflow-validation-20261028
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Format only to produce exact Prettier output
        run: |
          npx --yes prettier@3 --write .github/workflows/frontend.yml cspell.json
          git --no-pager diff -- .github/workflows/frontend.yml cspell.json
      - name: Commit cspell formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cspell.json
          if git diff --cached --quiet; then
            echo "cspell.json already formatted"
            exit 0
          fi
          git commit -m "style(ci): format spellcheck config"
          git push origin HEAD:ci/actionlint-workflow-validation-20261028
