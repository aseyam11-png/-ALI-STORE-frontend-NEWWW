name: Temporary Graphify Architecture Audit

on:
  push:
    branches:
      - fix/graphify-bootstrap-20261111

permissions:
  contents: read

concurrency:
  group: graphify-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphify-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Graphify
        run: |
          python -m pip install --upgrade uv
          uv tool install --upgrade "graphifyy==0.9.79"
          graphify --version

      - name: Build architecture graph
        run: graphify extract . --code-only

      - name: Trace authentication, API, catalog, and checkout
        shell: bash
        run: |
          set -euo pipefail
          graphify query "Trace the frontend HTTP client, cookie authentication and CSRF bootstrap, admin login and OTP, product price/currency mapping, cart migration, checkout, and Next.js API rewrites. Identify the relevant modules and cross-module dependencies."
          graphify path "HttpClient" "CheckoutPage"
          graphify explain "HttpClient"

      - name: Upload temporary graph artifact
        uses: actions/upload-artifact@v6
        with:
          name: alistore-graphify-audit
          path: graphify-out/
          if-no-files-found: ignore
