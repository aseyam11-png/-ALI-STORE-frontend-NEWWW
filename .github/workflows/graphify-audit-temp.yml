name: Temporary Graphify Architecture Audit

on:
  push:
    branches:
      - fix/frontend-contract-hardening-20261029

permissions:
  contents: read

concurrency:
  group: graphify-pr115-${{ github.ref }}
  cancel-in-progress: true

jobs:
  graphify-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Graphify
        run: |
          python -m pip install --upgrade uv
          uv tool install --upgrade "graphifyy==0.9.79"
          graphify --version

      - name: Build architecture graph
        run: graphify extract . --code-only

      - name: Focused code-path audit
        shell: bash
        run: |
          set -euo pipefail
          graphify query "Explain the interaction between HttpClient CSRF bootstrap, Next.js rewrites, auth login, product money validation, cart variant migration, checkout order creation, and their tests. Return only direct code dependencies and call relationships."
          graphify path "HttpClient" "LoginForm" --undirected
          graphify path "product.service.ts" "LocalizedPrice.tsx" --undirected
          graphify path "cart-api.service.ts" "checkout/page.tsx" --undirected
          graphify explain "HttpClient"
          graphify explain "requireCurrency()"
          graphify explain "mergeCartLines()"

      - name: Upload temporary graph artifact
        uses: actions/upload-artifact@v6
        with:
          name: alistore-pr115-graphify-audit
          path: graphify-out/
          if-no-files-found: ignore
