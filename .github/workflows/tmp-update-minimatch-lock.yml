name: Temporary targeted minimatch lock refresh

on:
  push:
    branches:
      - integration/admin-otp-api-20261111

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: integration/admin-otp-api-20261111
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Regenerate lockfile for the scoped minimatch override
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install and verify the selected dependency tree
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm ls @typescript-eslint/typescript-estree minimatch
          node --input-type=module -e "import assert from 'node:assert/strict'; import { minimatch } from './node_modules/@typescript-eslint/typescript-estree/node_modules/minimatch/dist/esm/index.js'; assert.equal(minimatch('src/example.ts', '**/*.ts'), true); console.log('nested minimatch 11 API smoke test passed');"

      - name: Commit lockfile and remove temporary workflow
        run: |
          git rm .github/workflows/tmp-update-minimatch-lock.yml
          git add package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security(deps): lock fixed minimatch for TypeScript ESTree"
          git push origin integration/admin-otp-api-20261111
