name: Temporary Config Format

on:
  push:
    branches:
      - fix/quality-gates-workflows-20261028

permissions:
  contents: write

jobs:
  format-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: fix/quality-gates-workflows-20261028
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Format Dependency Cruiser config
        run: npx --yes prettier@3 --write --ignore-path .prettierignore quality/dependency-cruiser.cjs

      - name: Commit formatted config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add quality/dependency-cruiser.cjs
          if git diff --cached --quiet; then
            echo "Config already formatted."
            exit 0
          fi
          git commit -m "style: format dependency-cruiser configuration"
          git push origin HEAD:fix/quality-gates-workflows-20261028
