name: Temporary Graphify Refresh

on:
  push:
    branches:
      - fix/frontend-contract-hardening-20261029

permissions:
  contents: read

jobs:
  graphify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Graphify
        run: |
          python -m pip install --upgrade uv
          uv tool install --upgrade "graphifyy==0.9.79"
      - name: Rebuild graph from updated sources
        run: graphify extract . --code-only
      - name: Verify commerce dependencies
        run: |
          graphify query "Trace HttpClient CSRF handling to frontend API calls, product service currency validation to product UI mapping, and backend cart merge to checkout submission. Include relevant tests."
          graphify explain "HttpClient"
          graphify explain "requireCurrency()"
          graphify explain "mergeCartLines()"
      - uses: actions/upload-artifact@v6
        with:
          name: graphify-refresh-frontend-commerce
          path: graphify-out/
          if-no-files-found: ignore
