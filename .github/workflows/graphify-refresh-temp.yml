name: Temporary Graphify Refresh

on:
  push:
    branches:
      - feat/separate-admin-email-otp-login

permissions:
  contents: read

jobs:
  graphify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Graphify
        run: |
          python -m pip install --upgrade uv
          uv tool install --upgrade "graphifyy==0.9.79"
      - name: Rebuild graph from updated sources
        run: graphify extract . --code-only
      - name: Verify administrator authentication dependencies
        run: |
          graphify query "Trace separate AdminLoginForm second-password and Turnstile payload to adminLogin, backend admin OTP challenge to ADMIN_LOGIN verification/resend, and the protected admin route guard. Include relevant contract tests."
          graphify path "AdminLoginForm" "adminLogin()" --undirected
          graphify path "EmailOtpForm" "verifyAdminLoginCode()" --undirected
          graphify explain "AdminLoginForm"
          graphify explain "adminLogin()"
          graphify explain "verifyAdminLoginCode()"
      - uses: actions/upload-artifact@v6
        with:
          name: graphify-refresh-frontend-admin-auth
          path: graphify-out/
          if-no-files-found: ignore
