name: Temporary CSpell Format

on:
  push:
    branches:
      - fix/quality-gates-workflows-20261028

permissions:
  contents: write

jobs:
  format-cspell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/quality-gates-workflows-20261028
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Format cspell configuration
        run: npx --yes prettier@3 --write cspell.json
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cspell.json
          if git diff --cached --quiet; then
            echo "cspell.json already formatted"
            exit 0
          fi
          git commit -m "style: format cspell configuration"
          git push origin HEAD:fix/quality-gates-workflows-20261028
