name: Temporary Graphify Final Verification

on:
  push:
    branches:
      - fix/frontend-contract-hardening-20261029

permissions:
  contents: read

jobs:
  graphify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Graphify
        run: |
          python -m pip install --upgrade uv
          uv tool install --upgrade "graphifyy==0.9.79"
      - name: Refresh final architecture graph
        run: graphify extract . --code-only
      - name: Verify relevant dependencies after tests
        run: |
          graphify query "Trace the HTTP client CSRF bootstrap, Next.js rewrites, SAR catalog mapping, cart merging, checkout submission, and their tests."
          graphify explain "HttpClient"
      - uses: actions/upload-artifact@v6
        with:
          name: graphify-final-fix-frontend-contract-hardening-20261029
          path: graphify-out/
          if-no-files-found: ignore
