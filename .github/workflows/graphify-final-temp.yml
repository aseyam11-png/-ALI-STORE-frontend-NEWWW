name: Temporary Graphify Final Verification

on:
  push:
    branches:
      - feat/separate-admin-email-otp-login

permissions:
  contents: read

jobs:
  graphify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Graphify
        run: |
          python -m pip install --upgrade uv
          uv tool install --upgrade "graphifyy==0.9.79"
      - name: Refresh final architecture graph
        run: graphify extract . --code-only
      - name: Verify relevant dependencies after tests
        run: |
          graphify query "Trace admin login form gate password and Turnstile fields to adminLogin, ADMIN_LOGIN OTP verify and resend, and admin route guard tests."
          graphify explain "HttpClient"
      - uses: actions/upload-artifact@v6
        with:
          name: graphify-final-feat-separate-admin-email-otp-login
          path: graphify-out/
          if-no-files-found: ignore
