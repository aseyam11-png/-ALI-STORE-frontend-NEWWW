name: Temporary Graphify Admin Auth Refresh

on:
  push:
    branches:
      - fix/admin-auth-mainline-20261112

permissions:
  contents: read

jobs:
  graphify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Graphify
        run: |
          python -m pip install --upgrade uv
          uv tool install --upgrade "graphifyy==0.9.79"
      - name: Rebuild architecture graph
        run: graphify extract . --code-only
      - name: Trace final admin login integration
        run: |
          graphify query "Trace the dedicated admin login page, second admin gate password and Cloudflare Turnstile payload, adminLogin service call, purpose-bound ADMIN_LOGIN OTP verification and resend, shared CSRF client, and admin route guard. Confirm customer LoginForm does not send admin gate fields."
          graphify path "AdminLoginForm" "adminLogin()" --undirected
          graphify path "EmailOtpForm" "verifyAdminLoginCode()" --undirected
          graphify explain "AdminLoginForm"
          graphify explain "adminLogin()"
      - uses: actions/upload-artifact@v6
        with:
          name: graphify-final-admin-mainline
          path: graphify-out/
          if-no-files-found: ignore
