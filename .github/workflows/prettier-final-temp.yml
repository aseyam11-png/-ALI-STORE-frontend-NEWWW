name: Temporary Prettier Repair

on:
  push:
    branches:
      - fix/frontend-contract-hardening-20261029

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Format remaining changed files
        run: npx --yes prettier@3 --write --ignore-path .prettierignore cspell.json \
            tests/register-flow-contract.test.mjs
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "cspell.json" "tests/register-flow-contract.test.mjs"
          git commit -m "style: format remaining files for CI"
          git push
