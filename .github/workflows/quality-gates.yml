name: ALI STORE Frontend Quality Gates

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "45 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ai-agent-integrity:
    name: AI agent script syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compile the trusted patch generator
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python -m py_compile .github/scripts/ai_engineer.py

  static-quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Contract tests
        run: npm run test:contracts

      - name: Prettier
        run: npx --yes prettier@3 --check "**/*.{js,mjs,cjs,ts,tsx,json,md,yml,yaml}" --ignore-path .prettierignore

      - name: Knip
        run: npx --yes knip@5 --no-progress

      - name: Dependency Cruiser
        run: npx --yes dependency-cruiser@16 --validate quality/dependency-cruiser.cjs src

      - name: Markdownlint
        run: npx --yes markdownlint-cli2@0.18 "**/*.md" "#node_modules/**" "#.next/**" "#out/**" "#coverage/**" "#unpacked_files/**" "#frontend-final-backup/**" "#uiux-backup-20260814-155817/**" "#references/**"

      - name: License inventory
        run: npx --yes license-checker@25 --production --summary

      - name: Production build
        run: npm run build

  security-supply-chain:
    name: Supply-chain security
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

  external-security:
    name: Optional SCA/compliance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Snyk dependency scan
        if: ${{ env.SNYK_TOKEN != '' }}
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: npx --yes snyk@latest test --severity-threshold=high

      - name: FOSSA license/compliance scan
        if: ${{ env.FOSSA_API_KEY != '' }}
        env:
          FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}
        run: npx --yes fossa-cli@latest analyze

  backend-quality:
    name: Optional Spring Boot backend verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect backend module
        id: detect
        shell: bash
        run: |
          if [ -f backend/pom.xml ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "No backend/pom.xml found; backend verification is explicitly skipped."
          fi

      - name: Set up Java 21
        if: steps.detect.outputs.available == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Maven verification
        if: steps.detect.outputs.available == 'true'
        shell: bash
        run: |
          if [ -f backend/mvnw ]; then
            chmod +x backend/mvnw
            ./backend/mvnw -B -f backend/pom.xml verify
          else
            mvn -B -f backend/pom.xml verify
          fi

  runtime-quality:
    name: Runtime browser quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

      - name: Start production server
        run: |
          nohup npm start -- --hostname 127.0.0.1 --port 3000 > /tmp/ali-store-next.log 2>&1 &
          echo $! > /tmp/ali-store-next.pid
          npx --yes wait-on@9 http://127.0.0.1:3000

      - name: Cypress smoke E2E
        run: npx --yes cypress@15 run --config baseUrl=http://127.0.0.1:3000

      - name: Lighthouse accessibility/performance/SEO
        run: |
          mkdir -p artifacts/lighthouse
          npx --yes lighthouse@13 http://127.0.0.1:3000             --output=json             --output-path=artifacts/lighthouse/home.json             --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"             --only-categories=accessibility,best-practices,performance,seo

      - name: axe accessibility audit
        run: |
          mkdir -p artifacts/axe
          npx --yes @axe-core/cli@4.13.0             http://127.0.0.1:3000             --stdout > artifacts/axe/home.json
        continue-on-error: true

      - name: Upload browser audit artifacts
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: frontend-browser-quality
          path: artifacts/
          if-no-files-found: ignore

      - name: Stop server
        if: always()
        run: |
          if [ -f /tmp/ali-store-next.pid ]; then
            kill $(cat /tmp/ali-store-next.pid) || true
          fi

  links:
    name: Broken-link scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: --root-dir "$(pwd)" --verbose --no-progress "./**/*.md" "./**/*.html"
          fail: true
          lycheeVersion: v0.24.2
          output: lychee/results.md
          jobSummary: true
