name: ALI STORE Frontend Quality Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/admin-auth-mainline-20261112]
  schedule:
    - cron: "45 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: frontend-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Static quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKEND_INTERNAL_URL: https://ali-store-backend-git-deploy-vercel-container-run-a0d65f-a-28f5.vercel.app
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Contract tests
        run: npm run test:contracts

      - name: Prettier changed files
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          files_file="$(mktemp)"
          git diff --name-only -z --diff-filter=ACMR "origin/$BASE_REF" HEAD -- \
            '*.js' '*.mjs' '*.cjs' '*.ts' '*.tsx' '*.json' '*.md' '*.yml' '*.yaml' > "$files_file"
          if [ ! -s "$files_file" ]; then
            echo "No changed files are covered by Prettier."
            exit 0
          fi
          xargs -0 -r npx --yes prettier@3 --check --ignore-path .prettierignore < "$files_file"

      - name: Prettier full-tree baseline audit
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        run: npx --yes prettier@3 --check "**/*.{js,mjs,cjs,ts,tsx,json,md,yml,yaml}" --ignore-path .prettierignore

