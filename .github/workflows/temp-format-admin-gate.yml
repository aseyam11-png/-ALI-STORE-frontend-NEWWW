name: Temporary focused Prettier formatting

on:
  push:
    branches:
      - fix/admin-login-gate-current-main-20261028

permissions:
  contents: write

jobs:
  format-focused-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Format only the admin-gate PR files
        run: |
          npx --yes prettier@3 --write \
            src/components/auth/CloudflareTurnstile.tsx \
            src/components/auth/LoginForm.tsx \
            src/features/auth/session.ts \
            tests/admin-login-gate-contract.test.mjs
      - name: Commit formatting if necessary
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          if git diff --quiet; then
            echo "All focused files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/auth/CloudflareTurnstile.tsx \
            src/components/auth/LoginForm.tsx \
            src/features/auth/session.ts \
            tests/admin-login-gate-contract.test.mjs
          git commit -m "style(auth): format admin gate changes"
          git push origin "HEAD:${BRANCH_NAME}"
