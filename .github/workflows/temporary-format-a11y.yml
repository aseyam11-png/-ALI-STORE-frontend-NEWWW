name: Temporary Accessibility Formatting

on:
  push:
    branches:
      - fix/quality-gates-workflows-20261028

permissions:
  contents: write

jobs:
  format-a11y-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/quality-gates-workflows-20261028
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Format changed accessibility files
        run: npx --yes prettier@3 --write "src/components/layout/Footer.tsx" "src/components/search/SmartAutocomplete.tsx"
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "src/components/layout/Footer.tsx" "src/components/search/SmartAutocomplete.tsx"
          if git diff --cached --quiet; then
            echo "Accessibility files already formatted."
            exit 0
          fi
          git commit -m "style: format accessibility fixes"
          git push origin HEAD:fix/quality-gates-workflows-20261028
