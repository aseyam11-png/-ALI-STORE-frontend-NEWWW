name: Temporary Formatting Helper

on:
  push:
    branches:
      - fix/quality-gates-workflows-20261028

permissions:
  contents: write

jobs:
  format-changed-nonworkflow-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: fix/quality-gates-workflows-20261028
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Format changed non-workflow files
        run: |
          npx --yes prettier@3 --write --ignore-path .prettierignore \
            ".lighthouserc.cjs" \
            ".pa11yci.json" \
            "cspell.json" \
            "src/app/(buyer)/buyer/profile/page.tsx" \
            "src/app/error.tsx" \
            "src/app/global-error.tsx" \
            "src/components/ui/error-state.tsx" \
            "tests/customer-ux-premium.test.mjs" \
            "tests/mocks/handlers.ts"

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            ".lighthouserc.cjs" \
            ".pa11yci.json" \
            "cspell.json" \
            "src/app/(buyer)/buyer/profile/page.tsx" \
            "src/app/error.tsx" \
            "src/app/global-error.tsx" \
            "src/components/ui/error-state.tsx" \
            "tests/customer-ux-premium.test.mjs" \
            "tests/mocks/handlers.ts"
          if git diff --cached --quiet; then
            echo "All changed non-workflow files already satisfy Prettier."
            exit 0
          fi
          git commit -m "style: format files changed by quality remediation"
          git push origin HEAD:fix/quality-gates-workflows-20261028
