name: Temporary Formatting Helper

on:
  push:
    branches:
      - fix/quality-gates-workflows-20261028

permissions:
  contents: write

jobs:
  format-quality-files:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v6
        with:
          ref: fix/quality-gates-workflows-20261028
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Format files
        run: |
          npx --yes prettier@3 --write --ignore-path .prettierignore \
            "src/components/layout/Footer.tsx" \
            "src/components/search/SmartAutocomplete.tsx" \
            "src/components/navigation/GlobalNavigation.tsx"

      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "src/components/layout/Footer.tsx" \
            "src/components/search/SmartAutocomplete.tsx" \
            "src/components/navigation/GlobalNavigation.tsx"
          if git diff --cached --quiet; then
            echo "All selected files already satisfy Prettier."
            exit 0
          fi
          git commit -m "style: format files required by quality gates"
          git push origin HEAD:fix/quality-gates-workflows-20261028
