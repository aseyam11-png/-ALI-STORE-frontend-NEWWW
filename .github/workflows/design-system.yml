name: ALI STORE Design System

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "10 4 * * 1"

permissions:
  contents: read

concurrency:
  group: design-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  design-system:
    name: Design System Gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install Design System tooling without changing lockfile
        run: npm install --no-save --no-package-lock storybook@10.6.1 @storybook/nextjs-vite@10.6.1 @storybook/addon-a11y@10.6.1 @storybook/addon-vitest@10.6.1 @storybook/addon-designs@11.1.4 vitest@5.0.3 @vitest/browser-playwright@5.0.3 playwright@latest style-dictionary@5.5.5 stylelint@17.16.0 eslint-plugin-jsx-a11y@6.10.2
      - name: Install Chromium for Storybook browser tests
        run: npx --no-install playwright install --with-deps chromium
      - name: Design System structure gate
        run: npm run design-system:check
      - name: Build governed tokens
        run: npm run design-tokens
      - name: JSX accessibility lint
        run: npx --no-install eslint -c eslint.a11y.config.mjs 'src/**/*.{js,jsx,ts,tsx}'
      - name: CSS lint
        run: npx --no-install stylelint 'src/**/*.css'
      - name: Storybook build
        run: npm run storybook:build
      - name: Storybook component tests
        run: npm run test-storybook
      - name: Upload Design System artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: design-system-artifacts
          path: |
            artifacts/design-system/
            storybook-static/
          if-no-files-found: ignore
          retention-days: 14

  chromatic:
    name: Optional Chromatic Visual Review
    if: ${{ vars.CHROMATIC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: design-system
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Install project dependencies
        run: npm ci
      - name: Install Storybook tooling
        run: npm install --no-save --no-package-lock storybook@10.6.1 @storybook/nextjs-vite@10.6.1 @storybook/addon-a11y@10.6.1 @storybook/addon-vitest@10.6.1 @storybook/addon-designs@11.1.4 chromatic@latest
      - name: Run Chromatic
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: npx --no-install chromatic --project-token "$CHROMATIC_PROJECT_TOKEN"
