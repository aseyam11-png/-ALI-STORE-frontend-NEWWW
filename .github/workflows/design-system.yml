name: ALI STORE Design System\n\non:\n  pull_request:\n    branches: [main]\n  workflow_dispatch:\n  schedule:\n    - cron: "10 4 * * 1"\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: design-system-${{ github.ref }}\n  cancel-in-progress: true\n\njobs:\n  design-system:\n    name: Design System Gates\n    runs-on: ubuntu-latest\n    timeout-minutes: 30\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v6\n        with:\n          persist-credentials: false\n      - name: Set up Node.js\n        uses: actions/setup-node@v6\n        with:\n          node-version: "24"\n          cache: npm\n      - name: Install project dependencies\n        run: npm ci\n      - name: Install Design System tooling without changing lockfile\n        run: npm install --no-save --no-package-lock storybook@10.6.1 @storybook/nextjs-vite@10.6.1 @storybook/addon-a11y@10.6.1 @storybook/addon-vitest@10.6.1 @storybook/addon-designs@11.1.4 style-dictionary@5.5.5 stylelint@latest eslint-plugin-jsx-a11y@6.10.2\n      - name: Design System structure gate\n        run: npm run design-system:check\n      - name: Build governed tokens\n        run: npm run design-tokens\n      - name: JSX accessibility lint\n        run: npx --no-install eslint -c eslint.a11y.config.mjs 'src/**/*.{js,jsx,ts,tsx}'\n      - name: CSS lint\n        run: npx --no-install stylelint 'src/**/*.css'\n      - name: Storybook build\n        run: npm run storybook:build\n      - name: Upload Design System artifacts\n        if: always()\n        uses: actions/upload-artifact@v6\n        with:\n          name: design-system-artifacts\n          path: |\n            artifacts/design-system/\n            storybook-static/\n          if-no-files-found: ignore\n          retention-days: 14\n\n  chromatic:\n    name: Optional Chromatic Visual Review\n    if: ${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}\n    runs-on: ubuntu-latest\n    timeout-minutes: 20\n    needs: design-system\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v6\n      - name: Set up Node.js\n        uses: actions/setup-node@v6\n        with:\n          node-version: "24"\n          cache: npm\n      - name: Install project dependencies\n        run: npm ci\n      - name: Install Storybook tooling\n        run: npm install --no-save --no-package-lock storybook@10.6.1 @storybook/nextjs-vite@10.6.1 @storybook/addon-a11y@10.6.1 @storybook/addon-vitest@10.6.1 @storybook/addon-designs@11.1.4 chromatic@latest\n      - name: Run Chromatic\n        env:\n          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}\n        run: npx --no-install chromatic --project-token "$CHROMATIC_PROJECT_TOKEN"\n